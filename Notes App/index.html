<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My Notes</h1>

        <!-- Note Form -->
        <form id="noteForm">

            <div class="form-group">
                <label for="noteTitle">Title</label>
                <input type="text" id="noteTitle" placeholder="Enter note title">

                <p id="titleError" class="error"></p>
            </div>

            <div class="form-group">
                <label for="noteContent">Content</label>
                <textarea id="noteContent" placeholder="Write your note..."></textarea>

                <p id="contentError" class="error"></p>
            </div>

            <button type="submit" id="saveBtn">Add Note</button>

        </form>


        <!-- Search -->
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search notes..."
            >
        </div>


        <!-- Notes -->
        <div id="notesContainer">
            <!-- Notes will be added here using JavaScript -->
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
